name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/JuiceMeter/JuiceMeter.csproj
          -c Release -r win-x64 -o dist/framework-dependent
          -p:SelfContained=false -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true --nologo

      - name: Publish (self-contained)
        run: >
          dotnet publish src/JuiceMeter/JuiceMeter.csproj
          -c Release -r win-x64 -o dist/self-contained
          -p:SelfContained=true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true --nologo

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/framework-dependent/* -DestinationPath JuiceMeter-win-x64.zip
          Compress-Archive -Path dist/self-contained/* -DestinationPath JuiceMeter-win-x64-self-contained.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JuiceMeter
          path: '*.zip'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
